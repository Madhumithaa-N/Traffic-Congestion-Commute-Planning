# render.yaml – SmartRoute AI Render Blueprint
#
# Deploys two services:
#   1. smartroute-backend  – Python FastAPI Web Service
#   2. smartroute-frontend – React/Vite Static Site
#
# HOW TO USE:
#   1. Push this file to GitHub (already done).
#   2. Render Dashboard → New → Blueprint → select this repo → Apply.
#   3. After services are created, add the two secret keys in Dashboard:
#        smartroute-backend  → Environment → GOOGLE_MAPS_API_KEY, GEMINI_API_KEY
#        smartroute-frontend → Environment → VITE_GOOGLE_MAPS_API_KEY
#      Then click "Save Changes" on each — Render rebuilds automatically.

services:

  # ── 1. FastAPI Backend ────────────────────────────────────────────────────
  - type: web
    name: smartroute-backend
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: REQUEST_TIMEOUT
        value: "20"
      - key: TRAFFIC_CACHE_TTL
        value: "60"
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: CORS_ORIGINS
        value: "*"
      # Add these two in Render Dashboard → smartroute-backend → Environment:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ── 2. React / Vite Frontend (Static Site) ───────────────────────────────
  - type: web
    name: smartroute-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist

    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      # The backend URL is always predictable from the service name above.
      - key: VITE_API_BASE_URL
        value: "https://smartroute-backend.onrender.com"
      # Add this in Render Dashboard → smartroute-frontend → Environment:
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false

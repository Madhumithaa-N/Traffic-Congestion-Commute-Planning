# render.yaml – SmartRoute AI Render Blueprint
#
# Deploys ONE service:
#   1. smartroute-backend  – Python FastAPI Web Service
#
# The React/Vite frontend is deployed separately on Vercel.
# Backend URL: https://smartroute-backend-m5nh.onrender.com
# Frontend URL: update CORS_ORIGINS below once Vercel URL is known
#
# HOW TO USE:
#   1. Push this file to GitHub.
#   2. Render Dashboard → smartroute-backend → Environment → add:
#        GOOGLE_MAPS_API_KEY   your_key_here
#        GEMINI_API_KEY        your_key_here
#      Then click "Save Changes" — Render rebuilds automatically.

services:

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: smartroute-backend
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: REQUEST_TIMEOUT
        value: "20"
      - key: TRAFFIC_CACHE_TTL
        value: "60"
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      # Update this to your actual Vercel frontend URL after first Vercel deploy
      - key: CORS_ORIGINS
        value: "https://smartroute-ai.vercel.app,http://localhost:5173,http://localhost:3000"
      # Add these two in Render Dashboard → smartroute-backend → Environment:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
